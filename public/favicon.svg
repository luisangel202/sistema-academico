<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="b" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="64" height="64" rx="16" fill="url(#a)"/>

  <!-- Book base -->
  <rect x="10" y="20" width="44" height="30" rx="4" fill="white" opacity="0.12"/>

  <!-- Book left page -->
  <rect x="10" y="20" width="21" height="30" rx="4" fill="white" opacity="0.18"/>

  <!-- Book spine -->
  <rect x="30" y="20" width="4" height="30" fill="white" opacity="0.35"/>

  <!-- Book right page -->
  <rect x="33" y="20" width="21" height="30" rx="4" fill="white" opacity="0.18"/>

  <!-- Left page lines -->
  <line x1="15" y1="28" x2="27" y2="28" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="15" y1="33" x2="27" y2="33" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="15" y1="38" x2="27" y2="38" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="15" y1="43" x2="23" y2="43" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Right page lines -->
  <line x1="37" y1="28" x2="49" y2="28" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="37" y1="33" x2="49" y2="33" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="37" y1="38" x2="49" y2="38" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="37" y1="43" x2="45" y2="43" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Graduation cap on top -->
  <polygon points="32,8 46,15 32,20 18,15" fill="url(#b)"/>
  <rect x="44" y="15" width="2.5" height="8" rx="1.25" fill="#93c5fd"/>
  <circle cx="45.25" cy="24" r="2" fill="#93c5fd"/>
</svg>
