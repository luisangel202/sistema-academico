<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#bgLarge)"/>

  <!-- Graduation cap shadow -->
  <ellipse cx="100" cy="118" rx="58" ry="14" fill="black" opacity="0.12"/>

  <!-- Graduation cap - base platform -->
  <ellipse cx="100" cy="108" rx="56" ry="15" fill="white" opacity="0.95"/>

  <!-- Graduation cap - top diamond -->
  <polygon points="100,44 158,90 100,108 42,90" fill="white"/>

  <!-- Graduation cap - highlight -->
  <polygon points="100,44 158,90 100,72" fill="white" opacity="0.25"/>

  <!-- Tassel cord -->
  <line x1="158" y1="90" x2="158" y2="128" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- Tassel ball -->
  <circle cx="158" cy="136" r="9" fill="white" opacity="0.9"/>

  <!-- Tassel fringe -->
  <line x1="152" y1="143" x2="146" y2="158" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="158" y1="145" x2="158" y2="162" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="164" y1="143" x2="170" y2="158" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <defs>
    <linearGradient id="bgLarge" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
</svg>
