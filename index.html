<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" rel="stylesheet" />

    <!-- Favicon principal -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fallback PNG para navegadores que no soportan SVG -->
    <link rel="alternate icon" href="/favicon.svg" />
    <!-- Apple touch icon -->
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO / Meta -->
    <title>EduRural — Sistema Académico</title>
    <meta name="description" content="Plataforma académica para instituciones educativas rurales colombianas. Gestión de notas, asistencia, comunicación y más." />
    <meta name="theme-color" content="#2563eb" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA: Apple / iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EduRural" />
    <link rel="apple-touch-icon" href="/maskable-icon.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="EduRural — Sistema Académico" />
    <meta property="og:description" content="Plataforma académica multi-institución para colegios rurales." />
    <meta property="og:type" content="website" />

    <!-- Prevent flash of unstyled content -->
    <style>
      body { margin: 0; background: #f9fafb; }
      #root { min-height: 100vh; }

      /* ── PWA Splash Screen ─────────────────────────── */
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #1e40af, #1d4ed8);
        transition: opacity 0.5s ease;
      }
      #app-splash.hide { opacity: 0; pointer-events: none; }
      .splash-content {
        display: flex; flex-direction: column; align-items: center; gap: 16px;
      }
      .splash-icon {
        width: 80px; height: 80px; border-radius: 20px;
        background: rgba(255,255,255,0.12);
        display: flex; align-items: center; justify-content: center;
      }
      .splash-title {
        color: #fff; font-size: 22px; font-weight: 800;
        letter-spacing: -0.5px; margin: 0;
        font-family: 'Inter', sans-serif;
      }
      .splash-spinner {
        width: 26px; height: 26px;
        border: 3px solid rgba(255,255,255,0.2);
        border-top-color: #fff; border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- PWA Splash Screen -->
    <div id="app-splash">
      <div class="splash-content">
        <div class="splash-icon">
          <svg width="48" height="48" viewBox="0 0 64 64" fill="none">
            <rect x="10" y="20" width="44" height="30" rx="4" fill="white" opacity="0.18"/>
            <rect x="10" y="20" width="21" height="30" rx="4" fill="white" opacity="0.25"/>
            <rect x="30" y="20" width="4" height="30" fill="white" opacity="0.4"/>
            <rect x="33" y="20" width="21" height="30" rx="4" fill="white" opacity="0.25"/>
            <line x1="15" y1="28" x2="27" y2="28" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
            <line x1="15" y1="33" x2="27" y2="33" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
            <line x1="37" y1="28" x2="49" y2="28" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
            <line x1="37" y1="33" x2="49" y2="33" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
            <polygon points="32,8 46,15 32,20 18,15" fill="#60a5fa"/>
          </svg>
        </div>
        <p class="splash-title">EduRural</p>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
